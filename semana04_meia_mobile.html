<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Semana 4 · Meia Maratona 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0f14;--card:#161921;--card2:#1c2030;--border:rgba(255,255,255,0.08);--text:#e8eaf0;--muted:#6b7390;--blue:#3b82f6;--amber:#f59e0b;--green:#22c55e;--red:#ef4444;--purple:#a855f7;--pink:#ec4899; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5;max-width:480px;margin:0 auto;padding-bottom:60px;}
  header{padding:28px 20px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}
  .header-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .back{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:8px;}
  .week-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.2em;color:var(--blue);text-transform:uppercase;margin-bottom:4px;}
  header h1{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;letter-spacing:0.03em;}
  header h1 span{color:var(--amber);}
  .vol-chip{background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.25);border-radius:10px;padding:8px 14px;text-align:center;flex-shrink:0;}
  .vol-chip .num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--amber);line-height:1;}
  .vol-chip .unit{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;}
  .week-strip{display:flex;gap:6px;padding:16px 20px 0;overflow-x:auto;scrollbar-width:none;}
  .week-strip::-webkit-scrollbar{display:none;}
  .day-btn{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;text-align:center;cursor:pointer;transition:all 0.15s;min-width:54px;}
  .day-btn .dname{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;}
  .day-btn .dnum{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1.1;}
  .day-btn .ddot{width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:transparent;}
  .day-btn.has-run .ddot{background:var(--blue);}
  .day-btn.has-gym .ddot{background:var(--green);}
  .day-btn.has-both .ddot{background:var(--amber);}
  .day-btn.has-race .ddot{background:var(--pink);}
  .day-btn.has-long .ddot{background:var(--amber);}
  .day-btn.rest{opacity:0.4;}
  .day-btn.active{background:var(--blue);border-color:var(--blue);}
  .day-btn.active .dname,.day-btn.active .dnum{color:white;}
  .day-btn.active .ddot{background:rgba(255,255,255,0.5);}
  .week-progress{padding:12px 20px 0;display:flex;align-items:center;gap:10px;}
  .prog-bar{flex:1;height:4px;background:var(--card2);border-radius:2px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--amber));border-radius:2px;transition:width 0.4s ease;}
  .prog-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);white-space:nowrap;}
  .day-detail{padding:20px;}
  .detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;}
  .detail-header h2{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:0.03em;line-height:1;}
  .detail-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px;}
  .tipo-badge{font-size:11px;padding:4px 12px;border-radius:20px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;flex-shrink:0;}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .metric{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;}
  .metric .m-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.12em;font-family:'DM Mono',monospace;margin-bottom:6px;}
  .metric .m-val{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;}
  .metric .m-sub{font-size:11px;color:var(--muted);margin-top:3px;}
  .metric.blue{border-color:rgba(59,130,246,0.3);background:rgba(59,130,246,0.07);}
  .metric.amber{border-color:rgba(245,158,11,0.3);background:rgba(245,158,11,0.07);}
  .metric.green{border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.07);}
  .metric.red{border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.07);}
  .metric.purple{border-color:rgba(168,85,247,0.3);background:rgba(168,85,247,0.07);}
  .metric.blue .m-val{color:#60a5fa;}.metric.amber .m-val{color:#fbbf24;}.metric.green .m-val{color:#4ade80;}.metric.red .m-val{color:#f87171;}.metric.purple .m-val{color:#c084fc;}
  .structure{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
  .structure h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.15em;font-family:'DM Mono',monospace;margin-bottom:14px;}
  .step{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border);}
  .step:last-child{border-bottom:none;padding-bottom:0;}.step:first-child{padding-top:0;}
  .step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:12px;font-weight:500;flex-shrink:0;margin-top:1px;}
  .step-body .step-title{font-weight:600;font-size:14px;margin-bottom:2px;}
  .step-body .step-desc{font-size:13px;color:var(--muted);line-height:1.4;}
  .step-pace{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted);white-space:nowrap;text-align:right;margin-top:2px;line-height:1;}
  .step-pace small{display:block;font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:0.1em;}
  .notes{background:var(--card2);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .notes .n-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.15em;font-family:'DM Mono',monospace;margin-bottom:10px;}
  .note-item{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted);line-height:1.4;}
  .note-item:last-child{border-bottom:none;}.note-item .ni{flex-shrink:0;}.note-item strong{color:var(--text);}
  .today-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.8);}}
  .milestone{background:rgba(168,85,247,0.07);border:1px solid rgba(168,85,247,0.25);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--purple);display:flex;gap:10px;align-items:flex-start;}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">‹ Hub</a>
  <div class="header-top">
    <div>
      <div class="week-label">Semana 4 · Pico + Teste · Meia 2026</div>
      <h1>16–22 <span>Nov</span></h1>
    </div>
    <div class="vol-chip">
      <div class="num">58</div>
      <div class="unit">km total</div>
    </div>
  </div>
</header>

<div class="week-strip" id="weekStrip"></div>
<div class="week-progress">
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="prog-label" id="progLabel">0 / 58 km</div>
</div>

<div class="day-detail" id="dayDetail"></div>

<script>
const TOTAL_KM = 58;
const days = [
  {
    id:0, name:"SEG", date:"16", full:"Segunda, 16 Nov",
    type:"run", label:"Fácil", color:"blue", km:7,
    metrics:[
      {label:"Distância",val:"7",unit:"km",color:"blue"},
      {label:"Ritmo indicativo",val:"6:10–6:25",unit:"/km · manda a FC",color:"amber"},
      {label:"FC máx",val:"142",unit:"bpm",color:"red"},
      {label:"Fase",val:"Pico",unit:"semana 4 de 5 até à meia",color:"green"},
    ],
    structure:[
      {n:"1",label:"Corrida fácil",desc:"Dia a seguir ao ginásio. Primeiro km como aquecimento. Sem strides.",pace:"6:10–6:25",paceUnit:"/km",color:"#60a5fa",bg:"rgba(59,130,246,0.12)"},
    ],
    notes:[
      {icon:"📊",text:"<strong>Semana 3 fechada:</strong> 5×1000 m a 4:28–4:31 · long run 18 km a 5:51 (2 km a 4:47–4:51 com vento forte de frente, FC 164-167) · taxa de suor ~0,8 L/h · força: squat 45 kg×5 controlado."},
      {icon:"🧪",text:"O treino-teste passou para <strong>sábado, 21 Nov</strong> (14 Nov: FC repouso 54 vs 49 + noite de 6 h = dois sinais)."},
    ]
  },
  {
    id:1, name:"TER", date:"17", full:"Terça, 17 Nov",
    type:"run", label:"Intervalos — 5×1500 m (manhã)", color:"amber", km:12.5,
    milestone:"Última sessão de intervalos antes da meia",
    metrics:[
      {label:"Distância",val:"~12,5",unit:"km",color:"blue"},
      {label:"Repetições",val:"5×1500m",unit:"a 4:35–4:38/km",color:"amber"},
      {label:"Recuperação",val:"2'30",unit:"andar 30 s + trote lento",color:"green"},
      {label:"FC teto",val:"~168",unit:"bpm no fim de cada rep.",color:"red"},
    ],
    structure:[
      {n:"1",label:"Aquecimento",desc:"2,5 km fáceis + 3 strides no fim, já quente (rápidos mas soltos).",pace:"6:10–6:25",paceUnit:"/km",color:"#4ade80",bg:"rgba(34,197,94,0.12)"},
      {n:"2",label:"5 × 1500 m",desc:"Ritmo entre 10k e meia: controlado e uniforme. A 5.ª igual à 1.ª. Percurso plano.",pace:"4:35–4:38",paceUnit:"/km",color:"#fbbf24",bg:"rgba(245,158,11,0.12)"},
      {n:"R",label:"Recuperação 2'30",desc:"Anda os primeiros 30 s, depois trote muito lento.",pace:"7:00+",paceUnit:"/km",color:"#4ade80",bg:"rgba(34,197,94,0.12)"},
      {n:"3",label:"Arrefecimento",desc:"2 km leves.",pace:"6:15–6:30",paceUnit:"/km",color:"#60a5fa",bg:"rgba(59,130,246,0.12)"},
    ],
    notes:[
      {icon:"🎯",text:"<strong>Não é para ir mais rápido que 4:35.</strong> Na semana passada os 1000 m saíram a 4:28 — hoje as repetições são 50% mais longas e o objetivo é ritmo controlado, não velocidade."},
      {icon:"🎚️",text:"<strong>Válvula:</strong> pernas pesadas do ginásio ou 2 sinais de alerta → 4×1500 m, ou repetições a 4:40."},
      {icon:"☀️",text:"De manhã (jantar com os sogros). Come qualquer coisa 1 h antes."},
    ]
  },
  {
    id:2, name:"QUA", date:"18", full:"Quarta, 18 Nov",
    type:"run", label:"Fácil + Strides + Ankle hops", color:"blue", km:7,
    metrics:[
      {label:"Distância",val:"7",unit:"km",color:"blue"},
      {label:"Strides",val:"6×20s",unit:"4:15–4:30/km",color:"purple"},
      {label:"Ankle hops",val:"2×15",unit:"no fim",color:"purple"},
      {label:"FC máx",val:"142",unit:"bpm",color:"red"},
    ],
    structure:[
      {n:"1",label:"Corrida fácil",desc:"Solto, FC a mandar.",pace:"6:10–6:25",paceUnit:"/km",color:"#60a5fa",bg:"rgba(59,130,246,0.12)"},
      {n:"S",label:"6 × 20 s strides",desc:"Rápido mas solto. Recupera 90 s A ANDAR.",pace:"4:15–4:30",paceUnit:"/km",color:"#c084fc",bg:"rgba(168,85,247,0.12)"},
      {n:"P",label:"Ankle hops 2×15",desc:"Saltos pequenos só com os tornozelos, contacto curto. Pliometria leve.",pace:"~3 min",paceUnit:"",color:"#c084fc",bg:"rgba(168,85,247,0.12)"},
    ],
    notes:[
      {icon:"🏋️",text:"<strong>Sem ginásio esta semana:</strong> a força de pernas foi feita domingo (15 Nov). Uma sessão pesada a 3 dias do teste estragava-o. Próxima: ativação leve na quarta, 25 Nov."},
    ]
  },
  {
    id:3, name:"QUI", date:"19", full:"Quinta, 19 Nov",
    type:"run", label:"Tempo curto — 4 km", color:"amber", km:8.5,
    metrics:[
      {label:"Distância",val:"~8,5",unit:"km",color:"blue"},
      {label:"Tempo",val:"4 km",unit:"a 4:50–4:55/km",color:"amber"},
      {label:"FC teto",val:"~160",unit:"bpm",color:"red"},
    ],
    structure:[
      {n:"1",label:"Aquecimento",desc:"2,5 km fáceis.",pace:"6:10–6:25",paceUnit:"/km",color:"#4ade80",bg:"rgba(34,197,94,0.12)"},
      {n:"2",label:"4 km contínuos",desc:"Ritmo de limiar controlado. Encurtado de 8 para 4 km: o objetivo é manter o ritmo vivo, não cansar para sábado.",pace:"4:50–4:55",paceUnit:"/km",color:"#fbbf24",bg:"rgba(245,158,11,0.12)"},
      {n:"3",label:"Arrefecimento",desc:"2 km leves.",pace:"6:15–6:30",paceUnit:"/km",color:"#60a5fa",bg:"rgba(59,130,246,0.12)"},
    ],
    notes:[
      {icon:"🎚️",text:"<strong>Válvula:</strong> se terça custou muito ou houver 2 sinais → só fácil + 4 strides. Sábado é mais importante."},
      {icon:"☀️",text:"De manhã se o escritório deixar; à noite também serve."},
    ]
  },
  {
    id:4, name:"SEX", date:"20", full:"Sexta, 20 Nov",
    type:"gym", label:"Descanso", color:"green", km:0,
    notes:[
      {icon:"😴",text:"Descanso total. <strong>Deita-te cedo</strong> — a noite de sexta é a que conta para o teste."},
      {icon:"🍝",text:"Jantar simples e com pouca fibra (arroz/massa + proteína magra). Nada de jantares pesados nem álcool."},
      {icon:"🛒",text:"<strong>Checklist:</strong> 2 géis Decathlon · plano de água (2 garrafas pequenas ou ponto de reabastecimento certo) · Adios Pro 4 · banda com elétrodos molhados · balança."},
    ]
  },
  {
    id:5, name:"SÁB", date:"21", full:"Sábado, 21 Nov",
    type:"long", label:"TREINO-TESTE — 18 km com 8 km a ritmo de meia", color:"amber", km:18,
    milestone:"Fixa a meta da meia: 1:42 / 1:40 / 1:38",
    metrics:[
      {label:"Distância",val:"18",unit:"km",color:"amber"},
      {label:"Bloco",val:"8 km",unit:"a 4:48 → 4:44/km",color:"red"},
      {label:"Géis",val:"1-2",unit:"~km 3 + opcional ~km 12",color:"green"},
      {label:"Água",val:"600-700",unit:"ml no total",color:"blue"},
    ],
    structure:[
      {n:"1",label:"Aquecimento (km 1-4)",desc:"Fácil, mesmo que o vento esteja pelas costas. No fim do km 4, 3 strides curtos.",pace:"6:00–6:15",paceUnit:"/km",color:"#4ade80",bg:"rgba(34,197,94,0.12)"},
      {n:"2",label:"Bloco a ritmo de meia (km 5-12)",desc:"Km 5-6 a 4:48. Km 7-10 a 4:45-4:46. Km 11-12 a 4:44 só se a FC deixar. Em ida e volta, para o vento contar nos dois sentidos.",pace:"4:48 → 4:44",paceUnit:"/km",color:"#f87171",bg:"rgba(239,68,68,0.12)"},
      {n:"3",label:"Arrefecimento (km 13-18)",desc:"Fácil. É aqui que se vê a durabilidade: as pernas aguentam o fácil sem custo?",pace:"6:10–6:30",paceUnit:"/km",color:"#60a5fa",bg:"rgba(59,130,246,0.12)"},
    ],
    notes:[
      {icon:"🚦",text:"<strong>De manhã, antes de sair:</strong> FC de repouso ≤ ~51 e noite razoável → teste. Se houver 2 sinais → long run fácil e decidimos a meta com os dados que já temos."},
      {icon:"🎯",text:"<strong>Como lemos:</strong> 8 km a 4:44–4:46 com FC média ≤160 e último km controlado → <strong>sub-1:40</strong> · 4:46–4:50 ou FC a chegar aos 163+ → <strong>1:41–1:42</strong> · não segura 4:50 ou FC >165 → <strong>1:42–1:43</strong>."},
      {icon:"💨",text:"<strong>Com vento forte de frente:</strong> não persigas o ritmo — segura o esforço (FC ~158-160) e compensa no sentido contrário. Lemos o bloco pela média ida+volta e pela FC."},
      {icon:"⚖️",text:"Pesagem antes/depois + anota a água bebida (2.º teste de taxa de suor)."},
      {icon:"⏰",text:"Se puderes, parte por volta das 9h30-10h, a hora a que vais correr a meia."},
    ]
  },
  {
    id:6, name:"DOM", date:"22", full:"Domingo, 22 Nov",
    type:"both", label:"Recovery + Upper Body (opcional)", color:"green", km:5,
    metrics:[
      {label:"Corrida",val:"5",unit:"km muito leve",color:"blue"},
      {label:"FC máx",val:"130",unit:"bpm",color:"red"},
      {label:"Ginásio",val:"Upper",unit:"opcional",color:"green"},
    ],
    structure:[
      {n:"1",label:"Recovery",desc:"Muito leve.",pace:"6:30+",paceUnit:"/km",color:"#60a5fa",bg:"rgba(59,130,246,0.12)"},
      {n:"G",label:"Upper body",desc:"Se houver tempo. Último upper antes da meia — mantém cargas, nada de novo.",pace:"~40 min",paceUnit:"",color:"#4ade80",bg:"rgba(34,197,94,0.12)"},
    ],
    notes:[
      {icon:"📤",text:"Envia-me o ficheiro do teste, o peso antes/depois e a água. Fixamos a meta e preparo a semana 5 (taper + meia) com o plano de ritmo por km."},
    ]
  }
];

const today = new Date();
const dayMap = {1:0,2:1,3:2,4:3,5:4,6:5,0:6};
const todayIdx = dayMap[today.getDay()];
const weekStart = new Date(2026,10,16);
const weekEnd   = new Date(2026,10,22,23,59);
const isThisWeek = today >= weekStart && today <= weekEnd;
const activeDay = isThisWeek ? todayIdx : 0;

const strip = document.getElementById('weekStrip');
days.forEach((d,i) => {
  const btn = document.createElement('div');
  const cls = d.type==='rest'?'rest':d.type==='both'?'has-both':d.type==='gym'?'has-gym':d.type==='race'?'has-race':d.type==='long'?'has-long':'has-run';
  btn.className = `day-btn ${cls}${i===activeDay?' active':''}`;
  const isToday = isThisWeek && i===todayIdx;
  btn.innerHTML = `<div class="dname">${d.name}</div><div class="dnum">${d.date}${isToday?'<span class="today-dot"></span>':''}</div><div class="ddot"></div>`;
  btn.addEventListener('click',() => selectDay(i));
  strip.appendChild(btn);
});

const kmDone = days.slice(0, isThisWeek ? todayIdx : (today > weekEnd ? 7 : 0)).reduce((a,d) => a+d.km, 0);
document.getElementById('progFill').style.width = `${(kmDone/TOTAL_KM)*100}%`;
document.getElementById('progLabel').textContent = `${kmDone} / ${TOTAL_KM} km`;

function selectDay(i) {
  document.querySelectorAll('.day-btn').forEach((b,j) => b.classList.toggle('active', j===i));
  renderDay(days[i]);
}

function renderDay(d) {
  const el = document.getElementById('dayDetail');
  const typeColors = {run:'#3b82f6',gym:'#22c55e',both:'#f59e0b',race:'#ec4899',long:'#f59e0b'};
  const typeBg = {run:'rgba(59,130,246,0.15)',gym:'rgba(34,197,94,0.15)',both:'rgba(245,158,11,0.15)',race:'rgba(236,72,153,0.15)',long:'rgba(245,158,11,0.15)'};
  const typeName = {run:'Corrida',gym:'Descanso',both:'Duplo',race:'Prova',long:'Long Run'};

  let html = `<div class="detail-header">
    <div><h2>${d.label}</h2><div class="detail-date">${d.full}</div></div>
    <div class="tipo-badge" style="background:${typeBg[d.type]};color:${typeColors[d.type]}">${typeName[d.type]}</div>
  </div>`;

  if (d.milestone) html += `<div class="milestone">⚡ <div><strong>${d.milestone}</strong></div></div>`;

  if (d.metrics) {
    html += `<div class="metrics">`;
    d.metrics.forEach(m => { html += `<div class="metric ${m.color}"><div class="m-label">${m.label}</div><div class="m-val">${m.val}</div><div class="m-sub">${m.unit}</div></div>`; });
    html += `</div>`;
  }

  if (d.structure) {
    html += `<div class="structure"><h3>Estrutura do treino</h3>`;
    d.structure.forEach(s => {
      html += `<div class="step">
        <div class="step-num" style="background:${s.bg};color:${s.color}">${s.n}</div>
        <div class="step-body"><div class="step-title">${s.label}</div><div class="step-desc">${s.desc}</div></div>
        <div class="step-pace" style="color:${s.color}">${s.pace}<small>${s.paceUnit}</small></div>
      </div>`;
    });
    html += `</div>`;
  }

  if (d.notes) {
    html += `<div class="notes"><div class="n-title">Notas do treino</div>`;
    d.notes.forEach(n => { html += `<div class="note-item"><span class="ni">${n.icon}</span><span>${n.text}</span></div>`; });
    html += `</div>`;
  }
  el.innerHTML = html;
}

selectDay(activeDay);
</script>
</body>
</html>
