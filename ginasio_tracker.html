<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ginásio · Semana 18</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14; --card: #161921; --card2: #1c2030;
    --border: rgba(255,255,255,0.08); --border-active: rgba(255,255,255,0.2);
    --text: #e8eaf0; --muted: #6b7390;
    --blue: #3b82f6; --amber: #f59e0b; --green: #22c55e; --red: #ef4444; --purple: #a855f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.5; max-width: 480px; margin: 0 auto; padding-bottom: 80px; }
  header { padding: 28px 20px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 20; }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .week-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--green); text-transform: uppercase; margin-bottom: 4px; }
  header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; line-height: 1; letter-spacing: 0.02em; }
  header h1 span { color: var(--amber); }
  .reset-btn { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: var(--red); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-family: 'DM Mono', monospace; cursor: pointer; margin-top: 4px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .tab { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: all 0.15s; }
  .tab.active { border-color: var(--green); background: rgba(34,197,94,0.07); }
  .tab .t-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; font-family: 'DM Mono', monospace; margin-bottom: 4px; }
  .tab .t-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; line-height: 1; }
  .tab.active .t-name { color: var(--green); }
  .tab .t-date { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .session-progress { padding: 12px 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .prog-bar { flex: 1; height: 5px; background: var(--card2); border-radius: 3px; overflow: hidden; }
  .prog-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--amber)); border-radius: 3px; transition: width 0.4s ease; }
  .prog-text { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .content { padding: 0 20px; }

  /* REF BLOCK */
  .ref-block { margin: 16px 0 4px; background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.2); border-radius: 12px; overflow: hidden; }
  .ref-toggle { padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: #60a5fa; }
  .ref-toggle .arrow { font-size: 11px; transition: transform 0.2s; }
  .ref-toggle.open .arrow { transform: rotate(180deg); }
  .ref-content { display: none; padding: 0 14px 14px; }
  .ref-content.open { display: block; }
  .ref-ex { margin-bottom: 10px; }
  .ref-ex-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .ref-series { display: flex; flex-wrap: wrap; gap: 4px; }
  .ref-serie { font-family: 'DM Mono', monospace; font-size: 11px; background: var(--card2); border-radius: 6px; padding: 3px 8px; color: var(--muted); }
  .ref-serie.done { color: var(--green); background: rgba(34,197,94,0.08); }
  .ref-note { font-size: 11px; color: var(--amber); margin-top: 3px; font-style: italic; }
  .ref-next { font-size: 11px; color: var(--amber); background: rgba(245,158,11,0.08); border-radius: 6px; padding: 3px 8px; margin-top: 4px; display: inline-block; }

  .group-block { margin-top: 24px; }
  .group-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .group-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .group-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.05em; line-height: 1; }
  .group-sub { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-left: auto; }
  .ex-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; transition: border-color 0.2s; }
  .ex-card.done { border-color: rgba(34,197,94,0.4); }
  .ex-header { padding: 14px 16px 12px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; }
  .ex-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-active); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.2s; }
  .ex-card.done .ex-check { background: var(--green); border-color: var(--green); }
  .ex-info { flex: 1; }
  .ex-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; line-height: 1.3; }
  .ex-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ex-badge { font-family: 'DM Mono', monospace; font-size: 11px; padding: 2px 8px; border-radius: 5px; }
  .ex-badge.sets { background: rgba(59,130,246,0.12); color: #60a5fa; }
  .ex-badge.tip-toggle { background: rgba(107,115,144,0.15); color: var(--muted); cursor: pointer; }
  .ex-badge.next { background: rgba(245,158,11,0.12); color: #fbbf24; }
  .ex-tip { padding: 0 16px; max-height: 0; overflow: hidden; transition: max-height 0.25s ease, padding 0.25s; }
  .ex-tip.open { max-height: 300px; padding: 0 16px 12px; }
  .ex-tip-inner { background: var(--card2); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .ex-tip-inner .ref { color: #60a5fa; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; }
  .ex-tip-inner .sug { color: #fbbf24; margin-top: 4px; font-size: 12px; }
  .series-block { padding: 0 14px 14px; }
  .series-header { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.15em; font-family: 'DM Mono', monospace; margin-bottom: 8px; border-top: 1px solid var(--border); padding-top: 10px; }
  .serie-row { display: grid; grid-template-columns: 28px 1fr 1fr auto; gap: 6px; align-items: center; margin-bottom: 6px; }
  .serie-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); text-align: center; }
  .serie-input { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px; width: 100%; text-align: center; outline: none; transition: border-color 0.15s; -webkit-appearance: none; }
  .serie-input:focus { border-color: var(--blue); }
  .serie-input.filled { border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.05); }
  .serie-input::placeholder { color: var(--muted); font-size: 11px; }
  .serie-done-btn { width: 32px; height: 32px; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
  .serie-done-btn.done { background: rgba(34,197,94,0.15); border-color: var(--green); color: var(--green); }
  .serie-note { grid-column: 2 / -1; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 12px; width: 100%; outline: none; resize: none; height: 32px; transition: border-color 0.15s, height 0.2s; display: none; }
  .serie-note:focus { border-color: rgba(107,115,144,0.4); height: 60px; color: var(--text); }
  .serie-note.has-note { display: block; color: var(--text); }
  .add-note-btn { grid-column: 2 / -1; background: none; border: none; color: var(--muted); font-size: 11px; font-family: 'DM Mono', monospace; cursor: pointer; text-align: left; padding: 2px 0; letter-spacing: 0.05em; }
  .complete-banner { display: none; margin: 20px 0 0; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.3); border-radius: 14px; padding: 20px; text-align: center; }
  .complete-banner.show { display: block; }
  .complete-banner .icon { font-size: 36px; margin-bottom: 8px; }
  .complete-banner h2 { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--green); margin-bottom: 6px; }
  .complete-banner p { font-size: 13px; color: var(--muted); }
  .export-btn { width: calc(100% - 40px); margin: 16px 20px 0; background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); color: var(--blue); border-radius: 14px; padding: 16px; font-size: 15px; font-family: 'DM Sans', sans-serif; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .export-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; padding: 20px; align-items: flex-end; }
  .export-modal.open { display: flex; }
  .export-box { background: var(--card); border: 1px solid var(--border-active); border-radius: 20px; padding: 20px; width: 100%; max-height: 70vh; display: flex; flex-direction: column; gap: 12px; }
  .export-box h3 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--blue); }
  .export-text { background: var(--card2); border-radius: 10px; padding: 14px; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text); line-height: 1.6; overflow-y: auto; flex: 1; white-space: pre-wrap; word-break: break-word; min-height: 200px; }
  .export-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .export-copy { background: var(--blue); border: none; border-radius: 10px; color: white; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .export-close { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); padding: 12px; font-size: 14px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <div class="week-label">Ginásio · Semana 18 · Set 2026</div>
      <h1>Força <span>&</span> Upper</h1>
    </div>
    <button class="reset-btn" onclick="resetSession()">↺ Reset</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tab-forca" onclick="switchSession('forca')">
    <div class="t-label">Quarta</div>
    <div class="t-name">Força Corredor (volume reduzido — Pico)</div>
    <div class="t-date">3 Set · após 7km</div>
  </div>
  <div class="tab" id="tab-upper" onclick="switchSession('upper')">
    <div class="t-label">Domingo</div>
    <div class="t-name">Upper Body (pós long run 32km)</div>
    <div class="t-date">6 Set · pós long run + 10km pace maratona</div>
  </div>
</div>

<div class="session-progress">
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="prog-text" id="progText">0 / 0 séries</div>
</div>

<div class="content" id="content"></div>
<button class="export-btn" onclick="openExport()">📋 Exportar resumo da sessão</button>

<div class="export-modal" id="resetModal">
  <div class="export-box" style="max-height:auto">
    <h3 style="color:var(--red)">↺ Reset sessão</h3>
    <p style="font-size:14px;color:var(--muted)">Apagar todos os registos desta sessão?</p>
    <div class="export-actions">
      <button class="export-copy" style="background:var(--red)" onclick="confirmReset()">Apagar</button>
      <button class="export-close" onclick="cancelReset()">Cancelar</button>
    </div>
  </div>
</div>

<div class="export-modal" id="exportModal">
  <div class="export-box">
    <h3>📋 Resumo para o Claude</h3>
    <div class="export-text" id="exportText"></div>
    <div class="export-actions">
      <button class="export-copy" onclick="copyExport()">Copiar texto</button>
      <button class="export-close" onclick="closeExport()">Fechar</button>
    </div>
  </div>
</div>

<script>
// ── REFERÊNCIA SEMANA 17 ──
const REF = {
  forca: {
    squat:     { series: ["50kg×8","50kg×8","50kg×8","50kg×8"], note:"\"Controlado\" nas 4 séries — cargas mantidas.", next:"Sem 18: reduz para 3 SÉRIES (Pico, volume ↓). Mantém 50kg×8." },
    hipthrust: { series: ["30kg×10","30kg×10","30kg×10","30kg×10"], note:"\"Controlado\" nas 4 séries.", next:"MANTÉM 30kg×10 — sem alteração de volume, protector (lombar)." },
    bulgarian: { series: ["8kg×8","8kg×8","8kg×8"], note:"Consolidado — desta vez sem desequilíbrio, \"controlado\" nas 3 séries.", next:"Sem 18: reduz para 2 SÉRIES (Pico, volume ↓). Mantém 8kg." },
    legpress:  { series: ["59kg×12","59kg×12","59kg×12"], note:"Consistente, em manutenção.", next:"MANTÉM 59kg — sem alteração de volume." },
    calfstand: { series: ["20kg×15","20kg×15","20kg×15","20kg×15"], note:"Consolidado nas 4 séries.", next:"MANTÉM 20kg — sem alteração de volume." },
    calfpress: { series: ["52kg×15","52kg×15","52kg×15"], note:"Consolidado a 52kg nas 3 séries.", next:"MANTÉM 52kg — sem alteração de volume." },
    plank:     { series: ["60s","60s","60s"], note:"Consolidado.", next:"Mantém 60s" },
    situp:     { series: ["15×","15×","15×"], note:"Consolidado.", next:"Mantém 15 reps" },
  },
  upper: {
    bench:        { series: ["40kg×10","40kg×10","40kg×10","40kg×10"], note:"Consolidado — \"últimas reps desafiantes\" nas S3/S4.", next:"Mantém 40kg×10 — sem restrições no upper body." },
    pushups:      { series: ["×12","×12","×12"], note:"Consistente.", next:"Mantém 3×12" },
    seatedrow:    { series: ["39kg×10","39kg×10","39kg×10","39kg×10"], note:"Consolidado a 39kg, \"controlado\".", next:"Tenta 40-41kg se sentires margem." },
    latpull:      { series: ["34kg×10","36kg×10","36kg×10"], note:"Progressão dentro da sessão — \"confortável\" a 34kg, \"controlado\" a 36kg. Zero desconforto.", next:"Tenta 37-38kg se zero desconforto persistir." },
    shoulderpress:{ series: ["10kg×10","10kg×10","10kg×10"], note:"\"Controlado\" nas 3 séries.", next:"Considera 11-12kg — bem consolidado há semanas." },
    facepull:     { series: ["14kg×15","14kg×15","14kg×15"], note:"\"Confortável\" nas 3 séries.", next:"Considera 16kg." },
    biceps:       { series: ["7.5kg×12","7.5kg×12","7.5kg×12"], note:"\"Fácil/confortável\" — pode estar pronto para subir.", next:"Tenta 8kg." },
    triceps:      { series: ["16kg×12","16kg×12","16kg×12"], note:"Consolidado nas 3 séries.", next:"Mantém 16kg ou tenta 18kg." },
    coreup:       { series: ["×15","×15","×15"], note:"Consolidado.", next:"Mantém ou varia" },
  }
};

const SESSIONS = {
  forca: {
    title: "Força Corredor",
    day: "Quinta, 3 Set",
    note: "PICO — volume reduzido nesta fase. Após 7km de corrida leve. Aquece bem. Pliometria reduzida para 5 min (não 10). Squat e Bulgarian com menos séries — as cargas mantêm-se, só o volume desce.",
    groups: [
      {
        name: "Pernas — Cadeia Posterior", color: "#fbbf24",
        exercises: [
          { id:"squat", name:"Squat (Barra)", sets:3, reps:"8",
            tip:"Barra nas costas, pés à largura dos ombros. Descida até às coxas paralelas. Joelhos seguem os pés. Costas neutras.",
            ref:"Sem 17: 50/50/50/50kg×8 — \"controlado\" nas 4 séries.",
            sug:"→ Sem 18: REDUZ para 3 SÉRIES (Pico). Mantém 50kg×8." },
          { id:"hipthrust", name:"Hip Thrust (Máquina)", sets:4, reps:"10",
            tip:"Costas no banco/máquina. Empurra os quadris até paralelo. Pausa 1seg, aperta o glúteo. Amplitude completa.",
            ref:"Sem 17: 30/30/30/30kg×10 — \"controlado\" nas 4 séries.",
            sug:"→ Sem 18: MANTÉM 4 séries a 30kg — sem alteração, protector (lombar)." },
          { id:"bulgarian", name:"Bulgarian Split Squat", sets:2, reps:"8/lado",
            tip:"Pé traseiro elevado. Desce o joelho traseiro em direção ao chão. Joelho da frente não passa a ponta do pé.",
            ref:"Sem 17: 8/8/8kg×8 — consolidado, sem desequilíbrio desta vez.",
            sug:"→ Sem 18: REDUZ para 2 SÉRIES (Pico). Mantém 8kg." },
          { id:"legpress", name:"Leg Press (Máquina)", sets:3, reps:"12",
            tip:"Pés à largura dos ombros no meio da plataforma. Não bloqueia os joelhos. Descida controlada.",
            ref:"Sem 17: 59/59/59kg×12 — consistente.",
            sug:"→ Sem 18: MANTÉM 3 séries a 59kg — sem alteração de volume." },
        ]
      },
      {
        name: "Gémeos", color: "#60a5fa",
        exercises: [
          { id:"calfstand", name:"Calf Raises Standing", sets:4, reps:"15",
            tip:"Step ou máquina. Sobe ao máximo, desce lentamente (3 seg) abaixo da linha neutra. A fase excêntrica é o que conta.",
            ref:"Sem 17: 20/20/20/20kg — consolidado nas 4 séries.",
            sug:"→ Sem 18: MANTÉM 4 séries a 20kg — sem alteração." },
          { id:"calfpress", name:"Calf Press (Máquina)", sets:3, reps:"15",
            tip:"Na leg press: pés na ponta da plataforma. Amplitude completa. Varia posição dos pés.",
            ref:"Sem 17: 52/52/52kg×15 — consolidado.",
            sug:"→ Sem 18: MANTÉM 3 séries a 52kg — sem alteração." },
        ]
      },
      {
        name: "Core", color: "#a855f7",
        exercises: [
          { id:"plank", name:"Prancha Frontal", sets:3, reps:"45–60seg", noWeight:true,
            tip:"Antebraços no chão, corpo em linha reta. Core ativo, sem baixar a bacia. Respira.",
            ref:"Sem 17: 60s×3 — consolidado.",
            sug:"→ Sem 18: mantém 60s." },
          { id:"situp", name:"Incline Sit-Ups", sets:3, reps:"15", noWeight:true,
            tip:"Banco inclinado. Movimento controlado, sem momentum. Mãos atrás da cabeça ou cruzadas no peito.",
            ref:"Sem 17: 15×3 — consolidado.",
            sug:"→ Sem 18: mantém." },
        ]
      }
    ]
  },
  upper: {
    title: "Upper Body",
    day: "Domingo, 6 Set",
    note: "Dia após o long run de 32km + 10km pace maratona. Zero pernas. Ombro esquerdo: reverse grip no Lat Pull continua a progredir bem.",
    groups: [
      {
        name: "Peito — Empurrar", color: "#f97316",
        exercises: [
          { id:"bench", name:"Bench Press", sets:4, reps:"8–10",
            tip:"Pega ligeiramente mais larga que os ombros. Barra desce ao peito, cotovelos a ~45°. Controla a descida (2 seg).",
            ref:"Sem 17: 40/40/40/40kg×10 — consolidado, \"últimas reps desafiantes\".",
            sug:"→ Sem 18: mantém 40kg×10." },
          { id:"pushups", name:"Push-Ups", sets:3, reps:"Máx", noWeight:true,
            tip:"Até falha logo após o Bench. Cotovelos a 45°. Se ficares abaixo de 5 reps, joelhos no chão.",
            ref:"Sem 17: 12/12/12 — consistente.",
            sug:"→ Sem 18: mantém 3×12." },
        ]
      },
      {
        name: "Costas — Puxar", color: "#60a5fa",
        exercises: [
          { id:"seatedrow", name:"Seated Row (Máquina)", sets:4, reps:"10",
            tip:"Costas erguidas, não inclinas para trás. Puxa para o abdómen, cotovelos rentes ao tronco. Pausa 1seg.",
            ref:"Sem 17: 39/39/39/39kg — consolidado, \"controlado\".",
            sug:"→ Sem 18: tenta 40-41kg se sentires margem." },
          { id:"latpull", name:"Lat Pull Down", sets:3, reps:"12",
            tip:"Pega larga, puxa até ao mento. Ligeiro lean-back. Controla a subida.",
            ref:"Sem 17: 34/36/36kg (reverse grip) — progressão dentro da sessão, \"confortável/controlado\", zero desconforto.",
            sug:"→ Sem 18: tenta 37-38kg se zero desconforto persistir." },
        ]
      },
      {
        name: "Ombros", color: "#c084fc",
        exercises: [
          { id:"shoulderpress", name:"Shoulder Press (Halteres)", sets:3, reps:"10",
            tip:"Sentado ou de pé. Halteres ao nível das orelhas, empurra para cima. Core ativo. Controla a descida.",
            ref:"Sem 17: 10/10/10kg×10 — \"controlado\".",
            sug:"→ Sem 18: considera 11-12kg — bem consolidado há semanas." },
          { id:"facepull", name:"Face Pull (Cabo)", sets:3, reps:"15",
            tip:"Cabo alto com corda. Puxa para o rosto, cotovelos altos e para fora. Lento e controlado.",
            ref:"Sem 17: 14/14/14kg×15 — \"confortável\".",
            sug:"→ Sem 18: considera 16kg." },
        ]
      },
      {
        name: "Braços + Core", color: "#4ade80",
        exercises: [
          { id:"biceps", name:"Bíceps Curls (Halteres)", sets:3, reps:"12",
            tip:"Alternado. Cotovelos fixos junto ao tronco. Desce lentamente (2 seg). Se balançares o tronco, está pesado de mais.",
            ref:"Sem 17: 7,5/7,5/7,5kg×12 — \"fácil/confortável\".",
            sug:"→ Sem 18: tenta 8kg." },
          { id:"triceps", name:"Tríceps Extension", sets:3, reps:"12",
            tip:"Com haltere atrás da cabeça ou cabo com pega em V. Cotovelo fixo, extensão completa. Não bloqueia o cotovelo.",
            ref:"Sem 17: 16/16/16kg — consolidado.",
            sug:"→ Sem 18: mantém 16kg ou tenta 18kg." },
          { id:"coreup", name:"Core (à escolha)", sets:3, reps:"45seg", noWeight:true,
            tip:"Prancha, dead bug, ou Russian twists. O que não fizeste na sessão de quarta.",
            ref:"Sem 17: 15×3 — consolidado.",
            sug:"→ Sem 18: mantém ou varia." },
        ]
      }
    ]
  }
};

let currentSession = 'forca';
let state = {};

function initState() {
  const saved = localStorage.getItem('gym_state_sem18_v1');
  if (saved) { try { state = JSON.parse(saved); return; } catch(e) {} }
  state = { forca: {}, upper: {} };
}

function saveState() {
  try { localStorage.setItem('gym_state_sem18_v1', JSON.stringify(state)); } catch(e) {}
}

function resetSession() { document.getElementById('resetModal').classList.add('open'); }
function confirmReset() { state[currentSession] = {}; saveState(); document.getElementById('resetModal').classList.remove('open'); renderSession(); }
function cancelReset() { document.getElementById('resetModal').classList.remove('open'); }

function switchSession(key) {
  currentSession = key;
  document.getElementById('tab-forca').classList.toggle('active', key === 'forca');
  document.getElementById('tab-upper').classList.toggle('active', key === 'upper');
  renderSession();
}

function getSetState(exId, setIdx) {
  if (!state[currentSession][exId]) state[currentSession][exId] = [];
  if (!state[currentSession][exId][setIdx]) state[currentSession][exId][setIdx] = { weight:'', reps:'', note:'', done:false };
  return state[currentSession][exId][setIdx];
}

function totalSets(session) { return session.groups.reduce((a,g) => a + g.exercises.reduce((b,e) => b + e.sets, 0), 0); }

function doneSets() {
  const s = SESSIONS[currentSession];
  let done = 0;
  s.groups.forEach(g => g.exercises.forEach(e => {
    for (let i = 0; i < e.sets; i++) { if (state[currentSession][e.id]?.[i]?.done) done++; }
  }));
  return done;
}

function updateProgress() {
  const total = totalSets(SESSIONS[currentSession]);
  const done = doneSets();
  document.getElementById('progFill').style.width = (total ? done/total*100 : 0) + '%';
  document.getElementById('progText').textContent = `${done} / ${total} séries`;
  const banner = document.getElementById('completeBanner');
  if (banner) banner.classList.toggle('show', done === total && total > 0);
}

function toggleTip(id) { document.getElementById('tip-'+id).classList.toggle('open'); }

function toggleSet(exId, setIdx) {
  const s = getSetState(exId, setIdx);
  s.done = !s.done;
  saveState();
  const btn = document.getElementById(`setbtn-${exId}-${setIdx}`);
  if (btn) btn.classList.toggle('done', s.done);
  const card = document.getElementById(`excard-${exId}`);
  if (card) {
    const ex = findEx(exId);
    const allDone = ex ? Array.from({length:ex.sets},(_,i) => state[currentSession][exId]?.[i]?.done).every(Boolean) : false;
    card.classList.toggle('done', allDone);
    const check = card.querySelector('.ex-check');
    if (check) check.textContent = allDone ? '✓' : '';
  }
  updateProgress();
}

function findEx(exId) {
  for (const g of SESSIONS[currentSession].groups) for (const e of g.exercises) if (e.id === exId) return e;
  return null;
}

function onInput(exId, setIdx, field, value) {
  const s = getSetState(exId, setIdx);
  s[field] = value;
  saveState();
  const inp = document.getElementById(`${field}-${exId}-${setIdx}`);
  if (inp) inp.classList.toggle('filled', value.trim() !== '');
}

function toggleNote(exId, setIdx) {
  const n = document.getElementById(`note-${exId}-${setIdx}`);
  if (n) { n.classList.add('has-note'); n.style.display='block'; n.focus(); }
}

function renderRef(session) {
  const refData = REF[session];
  const sess = SESSIONS[session];
  let html = `<div class="ref-block">
    <div class="ref-toggle" id="refToggle" onclick="toggleRef()">
      📊 Referência Semana 17 <span class="arrow">▼</span>
    </div>
    <div class="ref-content" id="refContent">`;
  sess.groups.forEach(g => {
    g.exercises.forEach(ex => {
      const r = refData[ex.id];
      if (!r) return;
      html += `<div class="ref-ex">
        <div class="ref-ex-name">${ex.name}</div>
        <div class="ref-series">`;
      r.series.forEach(s => { html += `<span class="ref-serie done">${s}</span>`; });
      html += `</div>`;
      if (r.note) html += `<div class="ref-note">💬 ${r.note}</div>`;
      if (r.next) html += `<div class="ref-next">💡 ${r.next}</div>`;
      html += `</div>`;
    });
  });
  html += `</div></div>`;
  return html;
}

function toggleRef() {
  const content = document.getElementById('refContent');
  const toggle = document.getElementById('refToggle');
  content.classList.toggle('open');
  toggle.classList.toggle('open');
}

function renderSession() {
  const session = SESSIONS[currentSession];
  let html = '';

  html += `<div style="margin:16px 0 4px;padding:12px 14px;background:var(--card2);border-radius:12px;font-size:13px;color:var(--muted);line-height:1.5">
    💡 ${session.note}
  </div>`;

  html += renderRef(currentSession);

  session.groups.forEach(group => {
    html += `<div class="group-block">
      <div class="group-header">
        <div class="group-dot" style="background:${group.color}"></div>
        <div class="group-title">${group.name}</div>
        <div class="group-sub">${group.exercises.length} exerc.</div>
      </div>`;

    group.exercises.forEach(ex => {
      const allDone = Array.from({length:ex.sets},(_,i) => state[currentSession][ex.id]?.[i]?.done).every(Boolean);
      html += `<div class="ex-card${allDone?' done':''}" id="excard-${ex.id}">
        <div class="ex-header" onclick="toggleTip('${ex.id}')">
          <div class="ex-check">${allDone?'✓':''}</div>
          <div class="ex-info">
            <div class="ex-name">${ex.name}</div>
            <div class="ex-meta">
              <span class="ex-badge sets">${ex.sets} × ${ex.reps}</span>
              <span class="ex-badge tip-toggle">dica + ref ↓</span>
            </div>
          </div>
        </div>
        <div class="ex-tip" id="tip-${ex.id}">
          <div class="ex-tip-inner">
            ${ex.tip}
            <div class="ref">📊 Sem 13: ${REF[currentSession][ex.id]?.series.join(' · ') || '—'}</div>
            <div class="sug">💡 ${ex.sug || '—'}</div>
          </div>
        </div>
        <div class="series-block">
          <div class="series-header">Séries</div>`;

      for (let i = 0; i < ex.sets; i++) {
        const s = getSetState(ex.id, i);
        const noteVal = s.note || '';
        html += `<div class="serie-row">
          <div class="serie-num">S${i+1}</div>
          ${ex.noWeight
            ? `<input class="serie-input${s.reps?' filled':''}" id="reps-${ex.id}-${i}" type="text" inputmode="numeric" placeholder="reps" value="${s.reps||''}" oninput="onInput('${ex.id}',${i},'reps',this.value)">`
            : `<input class="serie-input${s.weight?' filled':''}" id="weight-${ex.id}-${i}" type="text" inputmode="decimal" placeholder="kg" value="${s.weight||''}" oninput="onInput('${ex.id}',${i},'weight',this.value)">
               <input class="serie-input${s.reps?' filled':''}" id="reps-${ex.id}-${i}" type="text" inputmode="numeric" placeholder="reps" value="${s.reps||''}" oninput="onInput('${ex.id}',${i},'reps',this.value)">`
          }
          <button class="serie-done-btn${s.done?' done':''}" id="setbtn-${ex.id}-${i}" onclick="toggleSet('${ex.id}',${i})">✓</button>
          <textarea class="serie-note${noteVal?' has-note':''}" id="note-${ex.id}-${i}" placeholder="nota opcional..." oninput="onInput('${ex.id}',${i},'note',this.value)">${noteVal}</textarea>
          ${!noteVal?`<button class="add-note-btn" onclick="toggleNote('${ex.id}',${i})">+ nota</button>`:''}
        </div>`;
      }
      html += `</div></div>`;
    });
    html += `</div>`;
  });

  html += `<div class="complete-banner${doneSets()===totalSets(session)&&totalSets(session)>0?' show':''}" id="completeBanner">
    <div class="icon">💪</div>
    <h2>Sessão Completa!</h2>
    <p>Guarda os pesos — são a referência para a semana que vem.</p>
  </div>`;

  document.getElementById('content').innerHTML = html;
  updateProgress();
}

function generateExport() {
  const session = SESSIONS[currentSession];
  const name = currentSession==='forca'?'FORÇA CORREDOR':'UPPER BODY';
  const done = doneSets(), total = totalSets(session);
  const line = '━━━━━━━━━━━━━━━━━━━━━━';
  let txt = `💪 ${name} — ${session.day}\n${line}\n\n`;
  session.groups.forEach(group => {
    txt += `[ ${group.name.toUpperCase()} ]\n`;
    group.exercises.forEach(ex => {
      txt += `\n${ex.name} (${ex.sets}×${ex.reps})\n`;
      for (let i = 0; i < ex.sets; i++) {
        const s = state[currentSession][ex.id]?.[i];
        if (!s) { txt += `  S${i+1}: não registado\n`; continue; }
        const weight = s.weight?`${s.weight}kg`:'';
        const reps = s.reps?`× ${s.reps}`:'';
        const note = s.note?` — "${s.note}"`:'';
        txt += `  ${s.done?'✅':'⬜'} S${i+1}: ${[weight,reps].filter(Boolean).join(' ')}${note}\n`;
      }
    });
    txt += '\n';
  });
  txt += `${line}\n${done}/${total} séries concluídas\n`;
  if (done===total) txt += `✅ Sessão completa!\n`;
  return txt;
}

function openExport() { document.getElementById('exportText').textContent = generateExport(); document.getElementById('exportModal').classList.add('open'); }
function closeExport() { document.getElementById('exportModal').classList.remove('open'); }
function copyExport() {
  const text = document.getElementById('exportText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.export-copy');
    btn.textContent = '✓ Copiado!';
    setTimeout(() => btn.textContent = 'Copiar texto', 2000);
  }).catch(() => {
    const el = document.getElementById('exportText');
    const range = document.createRange(); range.selectNode(el);
    window.getSelection().removeAllRanges(); window.getSelection().addRange(range);
    document.execCommand('copy'); window.getSelection().removeAllRanges();
    const btn = document.querySelector('.export-copy');
    btn.textContent = '✓ Copiado!';
    setTimeout(() => btn.textContent = 'Copiar texto', 2000);
  });
}

initState();
renderSession();
</script>
</body>
</html>
