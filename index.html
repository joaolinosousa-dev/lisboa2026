<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meia 2026 · Hub</title>
<style>
  :root { --bg:#0d0f14; --card:#161921; --border:rgba(255,255,255,0.08); --text:#e8eaf0; --muted:#6b7390; --amber:#f59e0b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; max-width:480px; margin:0 auto; padding:40px 20px; min-height:100vh; }
  h1 { font-size:22px; margin-bottom:8px; }
  p { color:var(--muted); font-size:14px; margin-bottom:20px; }
  a { display:block; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; color:var(--text); text-decoration:none; margin-bottom:8px; font-size:14px; }
  a span { color:var(--amber); }
</style>
</head>
<body>
<h1>A abrir o hub da semana…</h1>
<p id="msg">Se não abrir sozinho, escolhe abaixo.</p>
<div id="links"></div>
<script>
// Página fixa: não precisa de ser atualizada. Abre o hub_sNN(_v).html mais recente da semana atual
// (ou o mais recente que exista). Semana 1 começa a 26 Out 2026 (segunda-feira).
const START = new Date(2026, 9, 26);
const MAX_WEEK = 30;
const pad = n => String(n).padStart(2, '0');
const now = new Date();
let current = Math.floor((now - START) / (7 * 86400000)) + 1;
current = Math.max(1, Math.min(current, MAX_WEEK));

async function exists(url) {
  try { const r = await fetch(url, { method: 'HEAD', cache: 'no-store' }); return r.ok; }
  catch (e) { return false; }
}

(async () => {
  // para cada semana, a versão mais recente: hub_sNN_9 … hub_sNN_2, hub_sNN
  async function latestHub(n) {
    for (let v = 9; v >= 2; v--) if (await exists(`hub_s${pad(n)}_${v}.html`)) return `hub_s${pad(n)}_${v}.html`;
    return (await exists(`hub_s${pad(n)}.html`)) ? `hub_s${pad(n)}.html` : null;
  }
  const found = [], file = {};
  for (let n = 1; n <= MAX_WEEK; n++) {
    const f = await latestHub(n);
    if (f) { found.push(n); file[n] = f; }
    else if (n > current + 1) break;
  }
  const links = document.getElementById('links');
  found.slice().reverse().forEach(n => {
    const a = document.createElement('a');
    a.href = file[n];
    a.innerHTML = `Hub · <span>Semana ${n}</span>`;
    links.appendChild(a);
  });
  const target = found.filter(n => n <= current).pop() || found[0];
  if (target) location.replace(file[target]);
  else document.getElementById('msg').textContent = 'Nenhum hub encontrado.';
})();
</script>
</body>
</html>
